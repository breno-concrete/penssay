spring.application.name=penssay

# OpenRouter speaks the OpenAI API; the key comes from the environment and never from the repository
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.temperature=0
# a vision call on a large photo can take longer than the 60 s default
spring.ai.openai.timeout=120s

penssay.transcription.model=google/gemma-3-27b-it
penssay.evaluation.model=google/gemma-3-27b-it

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
