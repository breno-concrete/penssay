spring.application.name=penssay

# OpenRouter speaks the OpenAI API; the key comes from the environment and never from the repository
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.temperature=0
# a vision call on a large photo can take longer than the 60 s default
spring.ai.openai.timeout=120s

# chosen by experiments/transcription_benchmark.py: 2.2% character error in ~4 s (open models: 6% or more)
penssay.transcription.model=google/gemini-3.1-flash-lite
# chosen by experiments/benchmark.py: total error 60 on essays with varied scores, ~26 s (Qwen3 235B ties but takes 125 s);
# on samples/benchmark-ext (90 essays with official or two-grader scores) it errs ~98, about as much as two human graders (~96)
penssay.evaluation.model=google/gemma-4-31b-it

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# each request waits ~12 s for the provider; virtual threads keep those waits from exhausting the server's threads
spring.threads.virtual.enabled=true
# behind the host's HTTPS proxy, take the client's address from X-Forwarded-For only when the request comes from a
# private-network proxy, so a client cannot pick its own address to escape the limits below
server.forward-headers-strategy=native

# cost protection (specs/004-launch-protection): checked before any paid model call.
# Set PENSSAY_LIMITS_ENABLED=false only on a local machine, e.g. to run the benchmarks
penssay.limits.enabled=${PENSSAY_LIMITS_ENABLED:true}
penssay.limits.window=1h
penssay.limits.evaluations-per-origin=10
penssay.limits.transcriptions-per-origin=20
# ~US$ 0.003 per correction and ~US$ 0.0015 per photo: both caps together stay near US$ 9 a day
penssay.limits.evaluations-per-day=1500
penssay.limits.transcriptions-per-day=3000
# an ENEM essay sheet has 30 lines (~2,700 characters); the cap keeps a huge text from costing 100 times more
penssay.limits.max-text-chars=6000
penssay.limits.max-theme-chars=300
