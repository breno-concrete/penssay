# Free local testing against Ollama's OpenAI-compatible endpoint: run with --spring.profiles.active=local
spring.ai.openai.base-url=http://localhost:11434/v1
# Ollama ignores the key, but the client refuses to start without one
spring.ai.openai.api-key=ollama

penssay.transcription.model=gemma3:4b
penssay.evaluation.model=gemma3:4b
