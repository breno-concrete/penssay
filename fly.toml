# Fly.io deploy (README, "Running it in public"). The app name must be unique on Fly: change it if taken.
app = "penssay"
primary_region = "gru" # São Paulo, close to the students

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # always one machine up: no cold start on ENEM day. Keep exactly ONE machine (fly scale count 1):
  # the usage limits live in memory, so a second machine would double every limit
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # each correction waits ~12 s on the provider; Fly's default (25 connections) would queue students
    type = "requests"
    soft_limit = 200
    hard_limit = 300

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
